<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracking Purchase Order</title>

<style>
body{
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#eef2f7,#d9e2ec);
}

.container{
  max-width:520px;
  margin:60px auto;
  background:white;
  padding:30px;
  border-radius:18px;
  box-shadow:0 8px 25px rgba(0,0,0,0.1);
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  height:50px;
  padding:0 15px;
  font-size:14px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-bottom:15px;
}

button{
  width:100%;
  height:50px;
  background:#2ecc71;
  color:white;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  transition:.3s;
}

button:hover{
  background:#27ae60;
}

/* TRACKING */

.tracking{
  display:flex;
  justify-content:space-around;
  align-items:center;
  margin:45px 0;
  position:relative;
}

/* Background line (shorter & centered) */
.tracking::before{
  content:"";
  position:absolute;
  top:21px;
  left:18%;
  width:64%;
  height:4px;
  background:#ddd;
  border-radius:5px;
  z-index:1;
}

/* Progress line */
.progress{
  position:absolute;
  top:21px;
  left:18%;
  height:4px;
  background:#2ecc71;
  border-radius:5px;
  z-index:2;
  transition:.4s ease;
}

.step{
  text-align:center;
  z-index:3;
}

.circle{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#ccc;
  margin:auto;
  line-height:42px;
  color:white;
  font-weight:bold;
  transition:.3s;
}

.step.active .circle{
  background:#2ecc71;
}

.step p{
  font-size:12px;
  margin-top:8px;
  font-weight:600;
}

/* Result Card */
.result-card{
  background:#f8f9fb;
  padding:20px;
  border-radius:15px;
  border:1px solid #eee;
}

.result-row{
  display:flex;
  justify-content:space-between;
  margin-bottom:14px;
  font-size:14px;
}

.status-badge{
  padding:5px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  color:white;
}

.status-diproses{ background:#f39c12; }
.status-dikirim{ background:#3498db; }
.status-sampai{ background:#2ecc71; }

</style>
</head>
<body>

<div class="container">
  <h2>🚚 Tracking Purchase Order</h2>
  <input id="poInput" placeholder="Masukkan Nomor PO">
  <button onclick="cekPO()">CEK STATUS</button>
  <div id="result"></div>
</div>

<script>

const API_URL="PASTE_API_URL_KAMU_DISINI";

function formatTanggal(v){
  if(!v) return "-";
  return new Date(v).toLocaleDateString("id-ID");
}

function generateTracking(status){
  const steps=["DIPROSES","DIKIRIM","SAMPAI GUDANG"];
  status=(status||"").toUpperCase();
  let activeIndex=steps.indexOf(status);
  if(activeIndex===-1) activeIndex=0;

  let progressWidth=(activeIndex/(steps.length-1))*64;

  return `
  <div class="tracking">
    <div class="progress" style="width:${progressWidth}%"></div>
    ${steps.map((step,i)=>`
      <div class="step ${i<=activeIndex?"active":""}">
        <div class="circle">${i<=activeIndex?"✔":""}</div>
        <p>${step}</p>
      </div>
    `).join("")}
  </div>`;
}

function getStatusBadge(status){
  status=status.toUpperCase();
  if(status==="DIPROSES") return `<span class="status-badge status-diproses">Diproses</span>`;
  if(status==="DIKIRIM") return `<span class="status-badge status-dikirim">Dikirim</span>`;
  if(status==="SAMPAI GUDANG") return `<span class="status-badge status-sampai">Sampai</span>`;
  return status;
}

async function cekPO(){
  const po=document.getElementById("poInput").value.trim();
  const res=document.getElementById("result");

  if(!po){
    res.innerHTML="❌ Nomor PO wajib diisi";
    return;
  }

  res.innerHTML="🔄 Memproses...";

  try{
    const response=await fetch(API_URL);
    const data=await response.json();

    let ditemukan=null;
    for(let i=data.length-1;i>=0;i--){
      if(String(data[i]["Nomor PO"]).trim()===po){
        ditemukan=data[i];
        break;
      }
    }

    if(!ditemukan){
      res.innerHTML="❌ Data tidak ditemukan";
      return;
    }

    res.innerHTML=`
      ${generateTracking(ditemukan["Status PO"])}

      <div class="result-card">
        <div class="result-row">
          <strong>📄 Nomor PO</strong>
          <span>${ditemukan["Nomor PO"]}</span>
        </div>

        <div class="result-row">
          <strong>🏢 Vendor</strong>
          <span>${ditemukan["Nama Vendor"]}</span>
        </div>

        <div class="result-row">
          <strong>🚚 Status</strong>
          ${getStatusBadge(ditemukan["Status PO"])}
        </div>

        <div class="result-row">
          <strong>📅 Estimasi</strong>
          <span>${formatTanggal(ditemukan["Perkiraan tanggal sampai"])}</span>
        </div>

        <div class="result-row">
          <strong>👤 PIC Vendor</strong>
          <span>${ditemukan["Nama PIC vendor"]}</span>
        </div>

        <div class="result-row">
          <strong>📝 Keterangan</strong>
          <span>${ditemukan["Keterangan"] || "-"}</span>
        </div>
      </div>
    `;
  }catch(err){
    res.innerHTML="❌ Gagal mengambil data";
  }
}

</script>
</body>
</html>
