<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tracking PO</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f4f6f9;
}

.container{
  width:500px;
  margin:60px auto;
  background:#fff;
  padding:30px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
}

h2{
  margin-bottom:20px;
}

input,button{
  width:100%;
  height:45px;
  margin-bottom:12px;
  padding:0 12px;
  font-size:14px;
}

button{
  cursor:pointer;
  background:#2ecc71;
  color:white;
  border:none;
  font-weight:bold;
}

button:hover{
  background:#27ae60;
}

/* TRACKING */
.tracking{
  display:flex;
  justify-content:space-between;
  margin:35px 10px;
  position:relative;
}

.tracking::before{
  content:"";
  position:absolute;
  top:20px;
  left:5%;
  width:90%;
  height:4px;
  background:#ddd;
  z-index:1;
}

.step{
  text-align:center;
  width:33%;
  position:relative;
  z-index:2;
}

.circle{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#ccc;
  margin:auto;
  line-height:40px;
  color:white;
  font-weight:bold;
}

.active .circle{
  background:#2ecc71;
}

.step p{
  font-size:12px;
  margin-top:8px;
  font-weight:600;
}

/* RESULT CARD */
.result-card{
  margin-top:20px;
  padding:18px;
  background:#fafafa;
  border-radius:10px;
  border:1px solid #eee;
}

.result-row{
  display:flex;
  margin-bottom:12px;
  font-size:14px;
}

.label{
  width:150px;
  font-weight:bold;
}

.value{
  flex:1;
}
</style>
</head>

<body>

<div class="container">
  <h2>🔎 Cek Status PO</h2>

  <input id="poInput" placeholder="Masukkan Nomor PO">
  <button onclick="cekPO()">CEK</button>

  <div id="result"></div>
</div>

<script>

const API_URL = "PASTE_API_URL_KAMU_DISINI";

function formatTanggal(v){
  if(!v) return "-";
  return new Date(v).toLocaleDateString("id-ID");
}

function generateTracking(status){
  const steps=["DIPROSES","DIKIRIM","SAMPAI GUDANG"];
  status=(status||"").toUpperCase();
  let activeIndex=steps.indexOf(status);
  if(activeIndex===-1) activeIndex=0;

  return `
  <div class="tracking">
    ${steps.map((step,i)=>`
      <div class="step ${i<=activeIndex?"active":""}">
        <div class="circle">${i<=activeIndex?"✔":""}</div>
        <p>${step}</p>
      </div>
    `).join("")}
  </div>`;
}

async function cekPO(){
  const po=document.getElementById("poInput").value.trim();
  const res=document.getElementById("result");

  if(!po){
    res.innerHTML="❌ Nomor PO wajib diisi";
    return;
  }

  res.innerHTML="🔍 Mencari data...";

  try{
    const response=await fetch(API_URL);
    const data=await response.json();

    let ditemukan=null;

    for(let i=data.length-1;i>=0;i--){
      if(String(data[i]["Nomor PO"]).trim()===po){
        ditemukan=data[i];
        break;
      }
    }

    if(!ditemukan){
      res.innerHTML="❌ Data tidak ditemukan";
      return;
    }

    res.innerHTML=`
      ${generateTracking(ditemukan["Status PO"])}

      <div class="result-card">

        <div class="result-row">
          <div class="label">📄 Nomor PO</div>
          <div class="value">${ditemukan["Nomor PO"]}</div>
        </div>

        <div class="result-row">
          <div class="label">🏢 Vendor</div>
          <div class="value">${ditemukan["Nama Vendor"]}</div>
        </div>

        <div class="result-row">
          <div class="label">🚚 Status</div>
          <div class="value">${ditemukan["Status PO"]}</div>
        </div>

        <div class="result-row">
          <div class="label">📅 Estimasi</div>
          <div class="value">${formatTanggal(ditemukan["Perkiraan tanggal sampai"])}</div>
        </div>

        <div class="result-row">
          <div class="label">👤 PIC Vendor</div>
          <div class="value">${ditemukan["Nama PIC vendor"]}</div>
        </div>

        <div class="result-row">
          <div class="label">📝 Keterangan</div>
          <div class="value">${ditemukan["Keterangan"] || "-"}</div>
        </div>

      </div>
    `;

  }catch(err){
    res.innerHTML="❌ Gagal mengambil data";
  }
}

</script>
</body>
</html>
